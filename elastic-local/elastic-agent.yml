outputs:
  default:
    type: elasticsearch
    hosts:
      - http://elasticsearch:9200

inputs:
  - id: microservices-files
    type: filestream
    use_output: default
    data_stream.namespace: local
    streams:
      - id: microservices-json
        data_stream:
          type: logs
          dataset: demo.microservices
        paths:
          - /logs/*.json
          - /logs/*.json.*
        parsers:
          - ndjson:
              target: ""
              overwrite_keys: true
              expand_keys: true
              add_error_key: true
        prospector.scanner.check_interval: 2s

agent.monitoring:
  enabled: false
agent.logging.level: info
agent.logging.to_stderr: true
