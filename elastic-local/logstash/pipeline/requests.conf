input {
  elastic_agent {
    port => 5044
    ssl_enabled => false
    enrich => none
    ecs_compatibility => "v8"
  }
}

filter {
  # Preserve the fields already used by the application and Kibana searches.
  mutate {
    add_field => { "[labels][processing_pipeline]" => "logstash_requests_v1" }
  }
  if [requestId] and ![http][request][id] {
    mutate { copy => { "requestId" => "[http][request][id]" } }
  }

  # Only gateway completion events represent completed HTTP requests.
  if [service][name] == "gateway-service" and [status] {
    mutate {
      copy => { "status" => "[http][response][status_code]" }
      add_field => { "[event][action]" => "gateway_request_completed" }
    }
    mutate { convert => { "[http][response][status_code]" => "integer" } }
    if [path] and ![url][path] {
      mutate { copy => { "path" => "[url][path]" } }
    }
    if [duration_ms] {
      ruby {
        code => 'v = event.get("duration_ms"); begin; event.set("[event][duration]", (Float(v) * 1000000).round); rescue ArgumentError, TypeError; event.tag("invalid_duration"); end'
      }
    }
    if [http][response][status_code] >= 500 {
      mutate {
        add_field => { "[event][outcome]" => "failure" }
        add_tag => ["http_5xx"]
      }
    } else if [http][response][status_code] >= 400 {
      mutate {
        add_field => { "[event][outcome]" => "failure" }
        add_tag => ["http_4xx"]
      }
    } else if [http][response][status_code] >= 200 {
      mutate {
        add_field => { "[event][outcome]" => "success" }
        add_tag => ["http_success"]
      }
    } else {
      mutate { add_field => { "[event][outcome]" => "unknown" } }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    ecs_compatibility => "v8"
    data_stream => true
    data_stream_auto_routing => true
    manage_template => false
    action => "create"
  }
}
